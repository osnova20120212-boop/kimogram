name: Runner check
on:
  workflow_dispatch:
jobs:
  mac:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, macos-15, macos-15-intel, macos-26-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - run: sw_vers && uname -m && ls -d /Applications/Xcode*.app && df -h /
