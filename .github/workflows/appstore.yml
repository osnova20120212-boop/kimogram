name: Kimogram for the App Store

# Builds the App Store edition (KimogramSettings.storeEdition: the switches Telegram's API terms
# forbid are hidden and off), signs it with the real distribution certificate and sends it to
# App Store Connect, where it shows up in TestFlight and can be submitted for review.
# Started by hand only (Actions -> "Kimogram for the App Store" -> Run workflow).
#
# Secrets it needs (Settings -> Secrets and variables -> Actions):
#   TELEGRAM_STORE_API_ID / TELEGRAM_STORE_API_HASH  api_id of the App Store app (falls back to
#                                                    TELEGRAM_API_ID / TELEGRAM_API_HASH)
#   APPLE_TEAM_ID              10-character team id of the paid Apple developer account
#   APPSTORE_BUNDLE_ID         bundle id registered for Kimogram (e.g. com.kimogram.messenger)
#   APPSTORE_APP_ID            numeric Apple ID of the app record in App Store Connect
#   SIGNING_CERT_P12           base64 of the "Apple Distribution" certificate + key, .p12 with an
#                              EMPTY password (ImportCertificates.py imports with -P '')
#   SIGNING_PROFILES_ZIP       base64 of a zip with the App Store provisioning profiles for the app
#                              and its extensions (.Share, .NotificationService,
#                              .NotificationContent, .Widget, .SiriIntents, .BroadcastUpload)
#   ASC_KEY_ID / ASC_ISSUER_ID / ASC_KEY_P8   App Store Connect API key used for the upload

on:
  workflow_dispatch:
    inputs:
      upload:
        description: 'Send the build to App Store Connect'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: kimogram-appstore
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26-intel
    timeout-minutes: 360

    steps:
      - name: Check secrets
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPSTORE_BUNDLE_ID: ${{ secrets.APPSTORE_BUNDLE_ID }}
          SIGNING_CERT_P12: ${{ secrets.SIGNING_CERT_P12 }}
          SIGNING_PROFILES_ZIP: ${{ secrets.SIGNING_PROFILES_ZIP }}
          API_ID: ${{ secrets.TELEGRAM_STORE_API_ID || secrets.TELEGRAM_API_ID }}
          API_HASH: ${{ secrets.TELEGRAM_STORE_API_HASH || secrets.TELEGRAM_API_HASH }}
        run: |
          missing=""
          for name in APPLE_TEAM_ID APPSTORE_BUNDLE_ID SIGNING_CERT_P12 SIGNING_PROFILES_ZIP API_ID API_HASH; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets:$missing (see the comment at the top of appstore.yml)"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Free disk space
        run: |
          sudo rm -rf ~/Library/Developer/CoreSimulator/Caches || true
          sudo rm -rf /Users/runner/Library/Android /usr/local/share/dotnet /usr/local/lib/node_modules || true
          df -h /

      - name: Select Xcode
        run: |
          WANTED=$(python3 -c 'import json;print(json.load(open("versions.json"))["xcode"])')
          if [ -d "/Applications/Xcode_$WANTED.app" ]; then
            XCODE="/Applications/Xcode_$WANTED.app"
          else
            XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -n 1)
            echo "::warning::Xcode $WANTED not found on runner, using $XCODE"
          fi
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Download Bazel for this Mac
        run: |
          BAZEL_VERSION=$(python3 -c 'import json;print(json.load(open("versions.json"))["bazel"].split(":")[0])')
          ARCH=$(uname -m); [ "$ARCH" = "x86_64" ] && BARCH=darwin-x86_64 || BARCH=darwin-arm64
          mkdir -p "$HOME/bazel-bin"
          curl -fsSL -o "$HOME/bazel-bin/bazel" "https://github.com/bazelbuild/bazel/releases/download/$BAZEL_VERSION/bazel-$BAZEL_VERSION-$BARCH"
          chmod +x "$HOME/bazel-bin/bazel"

      - name: Create canonical source directory
        run: |
          sudo mkdir -p /Users/Shared
          sudo chown "$USER" /Users/Shared
          cp -R "$GITHUB_WORKSPACE" /Users/Shared/telegram-ios

      - name: Write App Store configuration and signing files
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPSTORE_BUNDLE_ID: ${{ secrets.APPSTORE_BUNDLE_ID }}
          APPSTORE_APP_ID: ${{ secrets.APPSTORE_APP_ID }}
          SIGNING_CERT_P12: ${{ secrets.SIGNING_CERT_P12 }}
          SIGNING_PROFILES_ZIP: ${{ secrets.SIGNING_PROFILES_ZIP }}
          API_ID: ${{ secrets.TELEGRAM_STORE_API_ID || secrets.TELEGRAM_API_ID }}
          API_HASH: ${{ secrets.TELEGRAM_STORE_API_HASH || secrets.TELEGRAM_API_HASH }}
        run: |
          cd /Users/Shared/telegram-ios
          python3 - <<'EOF'
          import json, os
          cfg = json.load(open("build-system/appstore-configuration.json"))
          cfg["bundle_id"] = os.environ["APPSTORE_BUNDLE_ID"].strip()
          cfg["team_id"] = os.environ["APPLE_TEAM_ID"].strip()
          cfg["api_id"] = os.environ["API_ID"].strip()
          cfg["api_hash"] = os.environ["API_HASH"].strip()
          # The App Store edition: KimogramSettings.storeEdition follows this.
          cfg["is_appstore_build"] = "true"
          cfg["appstore_id"] = (os.environ.get("APPSTORE_APP_ID") or "0").strip()
          cfg["premium_iap_product_id"] = ""
          # Off until the account registers iCloud containers and Siri for these bundle ids.
          cfg["enable_icloud"] = False
          cfg["enable_siri"] = False
          json.dump(cfg, open("build-system/kimogram-store-configuration.json", "w"), indent=2)
          EOF

          SIGNING="$RUNNER_TEMP/kimogram-signing"
          mkdir -p "$SIGNING/certs" "$SIGNING/profiles"
          echo "$SIGNING_CERT_P12" | base64 --decode > "$SIGNING/certs/Distribution.p12"
          echo "$SIGNING_PROFILES_ZIP" | base64 --decode > "$RUNNER_TEMP/profiles.zip"
          unzip -j -o "$RUNNER_TEMP/profiles.zip" '*.mobileprovision' -d "$SIGNING/profiles"
          ls -l "$SIGNING/profiles"
          echo "SIGNING=$SIGNING" >> "$GITHUB_ENV"

      - name: Restore Bazel cache
        uses: actions/cache/restore@v4
        with:
          path: ~/telegram-bazel-cache
          key: bazel-store-${{ github.run_id }}
          restore-keys: |
            bazel-store-
            bazel-

      - name: Build
        run: |
          set -x
          cd /Users/Shared/telegram-ios
          # Same numbering as the sideload build, so every upload has a higher build number.
          BUILD_NUMBER="$(( $(git rev-list --count HEAD) + 100000 ))"
          APP_VERSION=$(python3 -c 'import json;print(json.load(open("versions.json"))["app"])')
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"

          python3 build-system/Make/ImportCertificates.py --path "$SIGNING/certs"
          python3 -u build-system/Make/Make.py \
            --overrideXcodeVersion \
            --bazel="$HOME/bazel-bin/bazel" \
            --overrideBazelVersion \
            --bazelUserRoot="/private/var/tmp/_bazel_kimogram" \
            --cacheDir="$HOME/telegram-bazel-cache" \
            build \
            --continueOnError \
            --configurationPath="build-system/kimogram-store-configuration.json" \
            --codesigningInformationPath="$SIGNING" \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER"

          mkdir -p build/artifacts
          cp -L bazel-bin/Telegram/Telegram.ipa build/artifacts/Kimogram-AppStore.ipa
          (cd bazel-bin/Telegram && zip -qry "/Users/Shared/telegram-ios/build/artifacts/Kimogram-AppStore-dSYMs.zip" *.dSYM) || true
          ls -lh build/artifacts

      - name: Save Bazel cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/telegram-bazel-cache
          key: bazel-store-${{ github.run_id }}

      - name: Send to App Store Connect
        if: ${{ inputs.upload }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY_P8" ]; then
            echo "::error::Add ASC_KEY_ID, ASC_ISSUER_ID and ASC_KEY_P8 to upload"
            exit 1
          fi
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s\n' "$ASC_KEY_P8" > "$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8"
          xcrun altool --validate-app --type ios \
            --file /Users/Shared/telegram-ios/build/artifacts/Kimogram-AppStore.ipa \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          xcrun altool --upload-app --type ios \
            --file /Users/Shared/telegram-ios/build/artifacts/Kimogram-AppStore.ipa \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - name: Keep the signed build and symbols
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Kimogram-AppStore-${{ env.APP_VERSION }}-${{ env.BUILD_NUMBER }}
          path: /Users/Shared/telegram-ios/build/artifacts/
          retention-days: 30
